<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="same-origin">
  <title>콘텐츠 관리 · 고전한입</title>
  <link rel="stylesheet" href="/admin/assets/styles.css">
  <script src="/admin/assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">古</span><div><span class="brand-name">고전한입</span><span class="brand-caption">콘텐츠 관리</span></div></div>
    <div id="session-actions" class="session-actions" hidden>
      <span id="session-name" class="muted"></span>
      <button id="refresh-button" class="button button-quiet" type="button">새로고침</button>
      <button id="logout-button" class="button button-quiet" type="button">로그아웃</button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section id="login-panel" class="login-layout" aria-labelledby="login-heading">
      <div class="login-introduction"><p class="eyebrow">한 권의 고전, 매일의 한입</p><h1>좋은 문장이<br>독자에게 닿도록.</h1><p>책부터 한입의 풀이까지,<br>고전한입의 서재를 함께 가꿔요.</p><div class="book-illustration" aria-hidden="true"><div>고전<br>한입</div><span>CLASSIC BITES</span></div></div>
      <div class="login-card">
        <p class="eyebrow">ADMIN</p><h2 id="login-heading">관리자 로그인</h2>
        <p class="muted">관리 권한이 있는 이메일 계정으로 로그인하세요.</p>
        <form id="login-form">
          <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="320" inputmode="email"></div>
          <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div>
          <p id="login-message" class="message" role="alert" hidden></p>
          <button id="login-button" class="button button-primary button-full" type="submit">로그인</button>
        </form>
        <p class="login-note">이 창을 새로 열거나 새로고침하면 다시 로그인합니다.</p>
      </div>
    </section>
    <section id="workspace" class="workspace" aria-label="서재 콘텐츠 관리" hidden>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="현재 위치"></nav>
      <div id="workspace-message" class="message" role="status" aria-live="polite" hidden></div>
      <div class="workspace-layout">
        <section id="catalog-panel" class="catalog-panel" aria-label="콘텐츠 목록" aria-busy="false"></section>
        <aside id="editor-panel" class="editor-panel" aria-label="콘텐츠 편집"></aside>
      </div>
    </section>
  </main>
  <dialog id="confirmation-dialog" class="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
    <h2 id="confirmation-title">변경 확인</h2>
    <p id="confirmation-message"></p>
    <div class="confirmation-actions">
      <button id="confirmation-cancel" class="button" type="button" autofocus>취소</button>
      <button id="confirmation-accept" class="button button-primary" type="button">확인</button>
    </div>
  </dialog>
  <footer class="site-footer">고전한입 <span aria-hidden="true">·</span> 작은 배움이 쌓이는 서재</footer>
</body>
</html>
